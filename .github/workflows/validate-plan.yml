name: Validate agent plans
# Do validation on pull requests and pushes to the main branch
on:
  pull_request:
  push:
    branches: [main]
# jobs define the steps to run in the workflow    
jobs:
 validate:
   runs-on: ubuntu-latest
   permissions:
     contents: read  # least privilege
   steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12 
    - run: pip install pyyaml
    - run: python scripts/validate_plan.py
